<rect class="box" x="63" y="136" width="296" height="48" rx="8"/>
<text x="211.2" y="157" text-anchor="middle"><tspan class="tb">② </tspan><tspan class="mono">preventDefault · validateBook → {}</tspan></text>
<text x="211.2" y="176" text-anchor="middle"><tspan class="ts">BookForm.jsx:31-36 · {} = 틀린 칸 없음</tspan></text>
<rect class="box" x="276" y="232" width="186" height="48" rx="8"/>
<text x="369.0" y="253" text-anchor="middle"><tspan class="tb">④ </tspan><tspan class="mono">setSubmitting(true)</tspan></text>
<text x="369.0" y="272" text-anchor="middle"><tspan class="ts">버튼 '처리 중…' (+32ms)</tspan></text>
<rect class="red" x="147" y="556" width="161" height="48" rx="8"/>
<text x="228.0" y="577" text-anchor="middle"><tspan>폼 위 ⚠️ 배너</tspan></text>
<text x="228.0" y="596" text-anchor="middle"><tspan class="ts">BookForm.jsx:44-48</tspan></text>
<rect class="box" x="651" y="556" width="205" height="48" rx="8"/>
<text x="753.6" y="577" text-anchor="middle"><tspan class="tb">⑩ </tspan><tspan class="mono">loading=true</tspan><tspan> → 스피너</tspan></text>
<text x="753.6" y="596" text-anchor="middle"><tspan class="ts">useBookDetail.js:24-26</tspan></text>
<rect class="green" x="677" y="780" width="179" height="36" rx="8"/>
<text x="766.3" y="803" text-anchor="middle"><tspan class="tb c-green">상세 화면 (+1247ms)</tspan></text>

<!-- 라벨 -->
<text x="157.0" y="113" text-anchor="middle"><tspan class="tb">① </tspan><tspan class="mono">submit</tspan></text>
<text x="298.5" y="207" text-anchor="middle"><tspan class="tb">③ </tspan><tspan class="mono">onSubmit(normalizeBook(values))</tspan></text>
<text x="218" y="227" text-anchor="end"><tspan class="ts">BookForm.jsx:37</tspan></text>
<text x="440.0" y="303" text-anchor="middle"><tspan class="tb">⑤ </tspan><tspan class="mono">createBook(values)</tspan></text>
<text x="359" y="323" text-anchor="end"><tspan class="ts">NewBookPage.jsx:16</tspan></text>
<text x="581.5" y="343" text-anchor="middle"><tspan class="tb">⑥ </tspan><tspan class="mono">POST /rest/v1/books?select=*</tspan></text>
<text x="581.5" y="377" text-anchor="middle"><tspan class="ts">Prefer: return=representation</tspan></text>
<text x="581.5" y="399" text-anchor="middle"><tspan class="tb">⑦ </tspan><tspan class="mono">201 { id: '…', created_at … }</tspan></text>
<text x="662" y="431" text-anchor="start"><tspan class="ts c-red">실패하면 </tspan><tspan class="mono c-red">error</tspan></text>
<text x="440.0" y="457" text-anchor="middle"><tspan class="tb">⑧ </tspan><tspan class="mono">created</tspan></text>
<text x="521" y="489" text-anchor="start"><tspan class="mono c-red">throw Error</tspan></text>
<text x="359" y="517" text-anchor="end"><tspan class="c-red">실패: </tspan><tspan class="mono c-red">catch → setSubmitError</tspan></text>
<text x="359" y="551" text-anchor="end"><tspan class="ts">NewBookPage.jsx:18-21</tspan></text>
<text x="379" y="517" text-anchor="start"><tspan class="tb">⑨ 성공: </tspan><tspan class="mono">navigate(bookPath(created.id), { replace: true })</tspan></text>
<text x="379" y="551" text-anchor="start"><tspan class="ts">NewBookPage.jsx:17 · 상세 주소로 이동 (+640ms)</tspan></text>
<text x="656" y="631" text-anchor="middle"><tspan class="mono">useBookDetail → getBook(id)</tspan></text>
<text x="581" y="671" text-anchor="middle"><tspan class="mono">GET ?id=eq.&lt;id&gt;</tspan></text>
<text x="582" y="711" text-anchor="middle"><tspan class="tb">⑪ </tspan><tspan class="mono">200</tspan></text>
<text x="653" y="751" text-anchor="middle"><tspan class="mono">item → setItem</tspan></text>

<!-- 범례 -->
<text x="24" y="648" text-anchor="start"><tspan class="ts">파랑 = 호출·요청 · 초록 = 결과·응답 · 빨간 점선 = 실패했을 때</tspan></text>
<text x="24" y="668" text-anchor="start"><tspan class="ts">회색 상자 = 그 컴포넌트 안의 상태 변경 · (+ms) = 클릭부터 잰 시각</tspan></text>
</svg>
