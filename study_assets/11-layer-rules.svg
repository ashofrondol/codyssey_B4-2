<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
<title id="title">import 방향 규칙 — scripts/check.mjs 가 검사하는 것</title>
<desc id="desc">pages 는 components, hooks, lib/books.js 를 import 할 수 있고, components 와 hooks 는 lib/books.js 를, lib/books.js 는 lib/supabase.js 를 import 한다(lib 밖에서 supabase.js 를 부르면 실패). components 나 hooks 가 pages 를 import 하면 검사가 실패한다(빨간 점선). routes.js 와 App.jsx 는 방향 규칙 밖의 공용 파일이다.</desc>
