<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" role="img" aria-labelledby="title desc">
<title id="title">AsyncView — 네 상태 중 하나만 고른다</title>
<desc id="desc">AsyncView 는 loading, error, isEmpty 를 위에서부터 차례로 확인해 처음 참인 상태의 화면(로딩, 에러, 빈) 하나만 그리고, 모두 거짓일 때만 children() 으로 성공 화면을 그린다. 오른쪽 표는 목록·상세·수정 페이지가 isEmpty 에 넘기는 조건이다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="820" height="540"/>

<text class="th" x="24" y="36">AsyncView — 네 상태 중 하나만 고른다</text>
<text class="ts" x="24" y="58">위에서부터 차례로 묻고, 처음 '예'가 나온 화면 하나만 그린다 · 예시 문구는 목록 페이지(BooksPage) 기준</text>

<!-- 입력 -->
<rect class="box" x="24" y="72" width="330" height="40" rx="8"/>
<text x="189" y="97" text-anchor="middle" class="mono">loading · error · isEmpty · children</text>

<!-- 결정 상자 -->
<rect class="box" x="24" y="140" width="150" height="44" rx="22"/>
<text x="99" y="167" text-anchor="middle" class="mono tb">loading?</text>
<rect class="box" x="24" y="236" width="150" height="44" rx="22"/>
<text x="99" y="263" text-anchor="middle" class="mono tb">error?</text>
<rect class="box" x="24" y="332" width="150" height="44" rx="22"/>
<text x="99" y="359" text-anchor="middle" class="mono tb">isEmpty?</text>

<!-- 결과 상자 -->
<rect class="blue" x="228" y="134" width="256" height="56" rx="10"/>
<text x="356" y="157" text-anchor="middle" class="mono c-blue">&lt;Loading message&gt;</text>
<text x="356" y="179" text-anchor="middle" class="ts">① 목록을 불러오는 중…</text>

<rect class="red" x="228" y="230" width="256" height="56" rx="10"/>
<text x="356" y="253" text-anchor="middle" class="mono c-red">&lt;ErrorState message onRetry&gt;</text>
<text x="356" y="275" text-anchor="middle" class="ts">② ⚠️ 오류 문구 + [다시 시도]</text>

<rect class="box" x="228" y="326" width="256" height="56" rx="10"/>
<text x="356" y="349" text-anchor="middle" class="mono">&lt;EmptyState {...emptyProps}&gt;</text>
<text x="356" y="371" text-anchor="middle" class="ts">③ 아직 기록된 책이 없습니다.</text>

<rect class="green" x="24" y="428" width="300" height="56" rx="10"/>
<text x="174" y="451" text-anchor="middle" class="mono c-green tb">children()</text>
<text x="174" y="473" text-anchor="middle" class="ts">④ 성공 화면 (데이터는 여기서만 사용)</text>

<!-- 아래로: 아니오 -->
<line class="ln" x1="99" y1="112" x2="99" y2="136" marker-end="url(#arrow)"/>
<line class="ln" x1="99" y1="184" x2="99" y2="232" marker-end="url(#arrow)"/>
<text class="ts" x="108" y="213">아니오</text>
<line class="ln" x1="99" y1="280" x2="99" y2="328" marker-end="url(#arrow)"/>
<text class="ts" x="108" y="309">아니오</text>
<line class="ln ln-green" x1="99" y1="376" x2="99" y2="424" marker-end="url(#arrow-green)"/>
<text class="ts c-green" x="108" y="405">아니오 (모두 아님)</text>

<!-- 오른쪽으로: 예 -->
<line class="ln ln-blue" x1="174" y1="162" x2="224" y2="162" marker-end="url(#arrow-blue)"/>
<text class="ts c-blue tb" x="199" y="153" text-anchor="middle">예</text>
<line class="ln ln-red" x1="174" y1="258" x2="224" y2="258" marker-end="url(#arrow-red)"/>
<text class="ts c-red tb" x="199" y="249" text-anchor="middle">예</text>
<line class="ln" x1="174" y1="354" x2="224" y2="354" marker-end="url(#arrow)"/>
<text class="ts tb" x="199" y="345" text-anchor="middle">예</text>

<!-- 오른쪽 표 -->
<rect class="zone" x="508" y="134" width="288" height="262" rx="10"/>
<text x="524" y="157" class="tb">페이지마다 '빈'의 뜻</text>
<line class="ln" x1="508" y1="168" x2="796" y2="168"/>

<text x="524" y="190" class="tb">BooksPage <tspan class="ts">(목록)</tspan></text>
<text x="524" y="212" class="mono">isEmpty={filtered.length === 0}</text>
<text x="524" y="232" class="ts">검색 결과까지 걸러서 0권이면</text>
<line class="ln" x1="524" y1="244" x2="780" y2="244"/>

<text x="524" y="266" class="tb">BookDetailPage <tspan class="ts">(상세)</tspan></text>
<text x="524" y="288" class="mono">isEmpty={!item}</text>
<text x="524" y="308" class="ts">"해당 기록을 찾을 수 없습니다."</text>
<line class="ln" x1="524" y1="318" x2="780" y2="318"/>

<text x="524" y="340" class="tb">EditBookPage <tspan class="ts">(수정)</tspan></text>
<text x="524" y="362" class="mono">isEmpty={!item}</text>
<text x="524" y="382" class="ts">"수정할 기록을 찾을 수 없습니다."</text>

<!-- 하단 -->
<text x="360" y="451" class="mono c-muted">AsyncView.jsx:25-28</text>
<text x="360" y="473" class="ts">우선순위: 로딩 &gt; 에러 &gt; 빈 &gt; 성공</text>
<text x="360" y="516" class="ts">↓ 아니오 = 다음 질문으로 · → 예 = 그 화면만 그리고 끝</text>
</svg>
