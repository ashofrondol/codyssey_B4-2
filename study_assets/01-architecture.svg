<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" role="img" aria-labelledby="title desc">
<title id="title">Reading Log 전체 구조</title>
<desc id="desc">사용자가 링크를 누르거나 주소를 입력하면 라우팅이 Layout 과 페이지를 고르고, 페이지는 커스텀 훅을, 훅은 데이터 접근 층을 부른다. 경로표 routes.js 는 여러 층이 함께 읽는 공용 표로 따로 그렸고, UI 컴포넌트 13개 중 prop 으로 달라지는 재사용 컴포넌트는 11개다. 데이터 접근 층(lib/books.js)만 오른쪽 Supabase 의 REST API 에 요청을 보내고 JSON 응답을 받으며, REST API 는 PostgreSQL 의 books 테이블을 읽고 쓴다. 앱 파일을 내려줄 Vercel 배포는 아직 없다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="860" height="580"/>
<text class="th" x="24" y="34">Reading Log 전체 구조</text>
<text class="ts" x="24" y="56">사용자 → 브라우저 안 앱 5층(위→아래로 겹쳐 그려짐) → 오른쪽 멀리 있는 Supabase</text>

<!-- 사용자 -->
<rect class="box" x="40" y="80" width="160" height="56" rx="10"/>
<text x="120" y="103" text-anchor="middle" class="tb">사용자</text>
<text x="120" y="125" text-anchor="middle" class="ts">클릭 · 입력 · 주소창</text>

<!-- Vercel -->
<rect class="box" x="560" y="76" width="276" height="78" rx="10"/>
<text x="698" y="99" text-anchor="middle" class="tb">Vercel (정적 호스팅)</text>
<text x="698" y="121" text-anchor="middle" class="mono">index.html 481 B · JS 401 KB</text>
<text x="698" y="143" text-anchor="middle" class="ts">배포 URL 아직 없음</text>

<!-- Vercel → 사용자 (점선) -->
<line class="ln dash" x1="556" y1="108" x2="205" y2="108" marker-end="url(#arrow)"/>
<rect class="bg" x="276" y="94" width="210" height="26"/>
<text x="381" y="112" text-anchor="middle" class="ts">첫 접속 때 1번 내려받음 (미배포)</text>

<!-- React 앱 영역 -->
<rect class="zone" x="24" y="164" width="584" height="344" rx="12"/>
<text x="592" y="186" text-anchor="end" class="ts">브라우저 안 React 앱</text>

<!-- 사용자 → 라우팅 -->
<line class="ln ln-blue" x1="120" y1="136" x2="120" y2="192" marker-end="url(#arrow-blue)"/>
<text x="130" y="156" class="ts c-blue">주소 이동 (링크 · 주소창)</text>

<!-- 5층 -->
<rect class="blue" x="40" y="196" width="300" height="48" rx="8"/>
<text x="190" y="216" text-anchor="middle" class="tb c-blue">라우팅</text>
<text x="190" y="236" text-anchor="middle" class="mono">main.jsx · App.jsx</text>

<rect class="box" x="40" y="256" width="300" height="48" rx="8"/>
<text x="190" y="276" text-anchor="middle" class="tb">공통 틀</text>
<text x="190" y="296" text-anchor="middle" class="mono">Layout = Navbar + &lt;Outlet/&gt;</text>

<rect class="box" x="40" y="316" width="300" height="48" rx="8"/>
<text x="190" y="336" text-anchor="middle" class="tb">페이지 7개</text>
<text x="190" y="356" text-anchor="middle" class="mono">BooksPage · BookDetailPage …</text>

<rect class="purple" x="40" y="376" width="300" height="48" rx="8"/>
<text x="190" y="396" text-anchor="middle" class="tb c-purple">상태(커스텀 훅)</text>
<text x="190" y="416" text-anchor="middle" class="mono">useBooks · useBookDetail</text>

<rect class="box" x="40" y="436" width="300" height="48" rx="8"/>
<text x="190" y="456" text-anchor="middle" class="tb">데이터 접근</text>
<text x="190" y="476" text-anchor="middle" class="mono">lib/books.js → lib/supabase.js</text>

<!-- 공용 경로표 -->
<rect class="box" x="424" y="196" width="168" height="52" rx="10"/>
<text x="508" y="217" text-anchor="middle" class="tb">공용 경로표</text>
<text x="508" y="238" text-anchor="middle" class="mono">routes.js</text>

<!-- UI 컴포넌트 -->
<rect class="box" x="424" y="268" width="168" height="108" rx="10"/>
<text x="508" y="291" text-anchor="middle" class="tb">UI 컴포넌트 13개</text>
<text x="508" y="311" text-anchor="middle" class="ts">재사용(prop 수용) 11개</text>
<text x="508" y="334" text-anchor="middle" class="mono">AsyncView</text>
<text x="508" y="354" text-anchor="middle" class="mono">Button …</text>
<line class="ln" x1="340" y1="346" x2="424" y2="346" stroke-width="1"/>
<text x="382" y="338" text-anchor="middle" class="ts">props 로</text>

<!-- Supabase 영역 -->
<rect class="zone" x="632" y="196" width="204" height="312" rx="12"/>
<text x="648" y="220" class="ts">Supabase (클라우드)</text>

<rect class="purple" x="652" y="240" width="164" height="60" rx="10"/>
<text x="734" y="265" text-anchor="middle" class="tb c-purple">PostgreSQL</text>
<text x="734" y="287" text-anchor="middle" class="mono">books 테이블</text>

<rect class="box" x="652" y="424" width="164" height="68" rx="10"/>
<text x="734" y="452" text-anchor="middle" class="tb">REST API</text>
<text x="734" y="474" text-anchor="middle" class="mono">/rest/v1/books</text>

<line class="ln" x1="734" y1="304" x2="734" y2="420" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="bg" x="644" y="347" width="180" height="28"/>
<text x="734" y="367" text-anchor="middle" class="ts">PostgREST 가 SQL 로 변환</text>

<!-- 요청 / 응답 -->
<line class="ln ln-blue" x1="340" y1="448" x2="648" y2="448" marker-end="url(#arrow-blue)"/>
<rect class="bg" x="400" y="418" width="168" height="29"/>
<text x="484" y="438" text-anchor="middle" class="mono c-blue">GET/POST/PATCH/DELETE</text>
<line class="ln ln-green" x1="652" y1="472" x2="344" y2="472" marker-end="url(#arrow-green)"/>
<text x="484" y="494" text-anchor="middle" class="ts c-green">JSON 응답</text>

<!-- 범례 -->
<text x="24" y="536" class="ts">파란 화살표 = 요청 · 초록 = 응답 · 보라 = 상태·데이터 · 점선 = 아직 없음(배포)</text>
<text x="24" y="558" class="ts">별 클릭·글자 입력은 라우팅을 거치지 않고 그 버튼·입력 칸을 가진 컴포넌트가 바로 받는다</text>

</svg>
